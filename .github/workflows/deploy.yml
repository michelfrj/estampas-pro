name: Deploy compiled Estampas Pro

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout compiled repository
        uses: actions/checkout@v4

      - name: Verify compiled-only payload
        shell: bash
        run: |
          set -euo pipefail
          test -s site/index.html
          test -s site/terms.html
          test -f site/.nojekyll
          grep -q --fixed-strings '/estampas-pro/assets/' site/index.html
          if find site -type f \( -name '*.map' -o -name '*.ts' -o -name '*.tsx' \) -print -quit | grep -q .; then
            echo 'Source or source map detected in public payload.'
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload compiled Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
